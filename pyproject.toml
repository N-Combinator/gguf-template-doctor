[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf-template-doctor"
version = "0.1.0"
description = "Offline CLI that reads a GGUF header, extracts the embedded chat template and flags common breakage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "jinja2>=3", "gguf>=0.9"]

[project.scripts]
gguf-template-doctor = "gguf_template_doctor.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/N-Combinator/gguf-template-doctor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
