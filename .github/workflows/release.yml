name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"
      - name: Test
        run: pytest -v
      - name: Check tag against the packaged version
        run: python scripts/check_version_tag.py "${GITHUB_REF_NAME}"
      - name: Build wheel and sdist
        run: python -m build
      - name: Check both artifacts were produced
        run: |
          ls -l dist
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            || { echo "no wheel in dist/"; exit 1; }
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" \
            || { echo "no sdist in dist/"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
